name: Frontend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test profile aggregation, transport and copy safety
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s . -p 'test_*.py'
      - name: Test source-qualified UI models
        run: node test_model.cjs
      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.json > /dev/null

  backend-platforms:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test installer platform routing and verification
        run: python3 -m unittest test_install_backend
      - name: Test native build and installation on ARM64
        # Test the installation engine; the user-facing CLI requires Omarchy.
        run: |
          python3 -c 'from pathlib import Path; import os; from install_backend import install; install(Path(os.environ["RUNNER_TEMP"]) / "backend")'
      - name: Check native executable and portable helpers
        run: |
          "$RUNNER_TEMP/backend/bin/onedrive-davfs-host" --help
          python3 "$RUNNER_TEMP/backend/share/onedrive-davfs/tools/profiles.py" --help
